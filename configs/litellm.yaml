# LiteLLM gateway for LLVerifier experiments on the ChatGPT/Codex subscription.
#
#   LLVerifier (configs/config.yaml, provider "codex")
#     -> LiteLLM   127.0.0.1:4001   (this file; start with scripts/start_gateway.sh)
#     -> OpenCodex 127.0.0.1:10100  (provider "openai" = your ChatGPT/Codex login)
#     -> chatgpt.com/backend-api/codex
#
# The ChatGPT backend does not take sampling knobs: OpenCodex strips temperature,
# top_p, max_tokens and stop before forwarding, and drops n and the penalties.
# They are removed here explicitly so LiteLLM does not reject temperature=0.1 for
# GPT-5 models, and the effective settings are just: model + reasoning_effort.

model_list:
  - model_name: codex-main            # heavy steps (preprocess, genPolicy, revise, ...)
    litellm_params:
      # LiteLLM strips the first "openai/"; OpenCodex then routes "openai/<model>"
      # to its "openai" provider only, so requests never fall through to the
      # anthropic / google / xai / cursor logins.
      model: openai/openai/gpt-6-astra
      api_base: http://127.0.0.1:10100/v1
      api_key: unused                 # OpenCodex on loopback needs no key
      reasoning_effort: medium
      # LiteLLM only knows reasoning_effort for models it recognises (e.g. "gpt-5*");
      # without this it rejects the param for gpt-6-astra with UnsupportedParamsError.
      allowed_openai_params: &allowed_params
        - reasoning_effort
      additional_drop_params: &dropped_params
        - temperature
        - top_p
        - max_tokens
        - max_completion_tokens
        - presence_penalty
        - frequency_penalty
        - n
        - stop
      max_parallel_requests: 2
      timeout: 900

  - model_name: codex-mini            # variable-generation steps (genPolicyVars, genEventVars, genPropVars)
    litellm_params:
      model: openai/openai/gpt-5.6-luna
      api_base: http://127.0.0.1:10100/v1
      api_key: unused
      reasoning_effort: medium
      allowed_openai_params: *allowed_params
      additional_drop_params: *dropped_params
      max_parallel_requests: 2
      timeout: 600

  - model_name: codex-sol             # variable-type steps since 2026-11-01 (genPolicyVars, genEventVars, genPropVars)
    litellm_params:
      model: openai/openai/gpt-6.1-sol
      api_base: http://127.0.0.1:10100/v1
      api_key: unused
      reasoning_effort: medium
      allowed_openai_params: *allowed_params
      additional_drop_params: *dropped_params
      max_parallel_requests: 2
      timeout: 600

  - model_name: codex-luna6           # LLM comparison (2026-11-05): every stage on gpt-6-luna
    litellm_params:
      model: openai/openai/gpt-6-luna
      api_base: http://127.0.0.1:10100/v1
      api_key: unused                 # OpenCodex on loopback needs no key
      reasoning_effort: medium
      allowed_openai_params: *allowed_params
      additional_drop_params: *dropped_params
      max_parallel_requests: 2
      timeout: 900

  - model_name: claude-opus           # LLM comparison (2026-11-05): every stage on Claude Opus 5.5, via OpenCodex's anthropic login
    litellm_params:
      model: openai/anthropic/claude-opus-5-5
      api_base: http://127.0.0.1:10100/v1
      api_key: unused                 # OpenCodex on loopback needs no key
      reasoning_effort: medium
      allowed_openai_params: *allowed_params
      additional_drop_params: *dropped_params
      max_parallel_requests: 2
      timeout: 900

litellm_settings:
  num_retries: 2

general_settings:
  master_key: YOUR_API_KEY       # also set as the "codex" api_key in configs/config.yaml
